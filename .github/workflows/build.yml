name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: rag-arena-linux-x86_64
            binary: dist/rag-arena
          - os: windows-latest
            artifact: rag-arena-windows-x86_64
            binary: dist/rag-arena.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Build single-file binary
        shell: bash
        run: |
          SEP="${{ runner.os == 'Windows' && ';' || ':' }}"
          uv run --with pyinstaller pyinstaller \
            --onefile --clean --name rag-arena \
            --add-data "static${SEP}static" \
            --add-data "arena.db${SEP}." \
            --collect-all uvicorn --collect-all fastapi \
            app.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
